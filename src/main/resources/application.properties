spring.application.name=transfer-api
server.port=8081

#spring.datasource.url=jdbc:postgresql://localhost:5432/transfer
#spring.datasource.username=transfer
#spring.datasource.password=transfer
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:h2:mem:transfer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema is owned by Flyway migrations; Hibernate only validates the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.com.ada.caixa.transfer=DEBUG
