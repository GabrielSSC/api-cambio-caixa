services:
  postgres:
    image: postgres:16-alpine
    container_name: transfer-postgres
    environment:
      POSTGRES_DB: transfer
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: transfer
    ports:
      - "5432:5432"
    volumes:
      - transfer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer -d transfer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transfer_pgdata:
